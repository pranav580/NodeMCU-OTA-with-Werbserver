; NodeMCU 1.0 (ESP-12E), 4 MB flash, OTA slot about 1019 KB.
; Headers are included by the sketch. If you add another .cpp file, list it below.
[platformio]
src_dir = .
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800
board_build.ldscript = eagle.flash.4m2m.ld
; Do not filter the .ino by name. PlatformIO converts it to a .cpp first.
build_src_filter = +<*> -<.pio/> -<.git/>
